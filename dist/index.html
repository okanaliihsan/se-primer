<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SE Primer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Düzen: tek sütun "gece nöbeti" kitabı; lacivert gece zemini, turuncu el feneri vurgusu,
   kriz anları Windows durma ekranı mavisiyle işaretlenir. */
:root {
  --bg: #0f1830;          /* gece nöbeti laciverti (ders afişinden) */
  --surface: #17233f;
  --raise: #1e2d50;
  --fg: #eef0f6;
  --muted: #a6b0c8;
  --line: #2c3b60;
  --accent: #f2a65a;      /* el feneri turuncusu */
  --accent-ink: #1a1206;
  --bsod: #0a62c9;        /* durma ekranı mavisi */
  --good: #6fd3a4;
  --bad: #ff8a7a;
  --late: #f2d06b;
  --paper: #f4efe2;
  --paper-ink: #2a2a2a;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f5fa; --surface: #ffffff; --raise: #e8ecf5; --fg: #121e3b; --muted: #55607a; --line: #d3d9e6;
    --accent: #c76a12; --accent-ink: #ffffff; --bsod: #0a5ab8; --good: #1c7d55; --bad: #b8382a; --late: #8a6a00;
    --paper: #fbf7ec; --paper-ink: #2a2a2a; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f5fa; --surface: #ffffff; --raise: #e8ecf5; --fg: #121e3b; --muted: #55607a; --line: #d3d9e6;
  --accent: #c76a12; --accent-ink: #ffffff; --bsod: #0a5ab8; --good: #1c7d55; --bad: #b8382a; --late: #8a6a00;
  --paper: #fbf7ec; --paper-ink: #2a2a2a; color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--read); font-size: 17px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#app { max-width: 480px; margin: 0 auto; padding-block: 20px 48px; }
.screen { display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 2rem; line-height: 1.1; font-weight: 800; }
h2 { font-size: 1.35rem; line-height: 1.2; font-weight: 700; }
h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 600; margin-top: 8px; }
p { margin: 0; }
.eyebrow { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* kapak */
.cover { display: flex; flex-direction: column; gap: 8px; padding-block: 12px 4px; border-bottom: 1px solid var(--line); padding-bottom: 18px; }
.cover .sub { font-family: var(--display); font-size: 1.35rem; color: var(--accent); font-weight: 600; }
.based { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
.lead { color: var(--muted); }
.group { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.group legend { font-family: var(--display); font-weight: 600; font-size: 1rem; margin-bottom: 8px; padding: 0; }
.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.chip { font: inherit; font-size: 0.95rem; text-align: left; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.chip small { font-size: 0.75rem; color: var(--muted); line-height: 1.3; }
.chip.sel { border-color: var(--accent); background: var(--raise); box-shadow: inset 0 0 0 1px var(--accent); }
.group:first-of-type .chips, .group:last-of-type .chips { grid-template-columns: 1fr; }

button { font: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.primary { font-family: var(--display); font-weight: 700; font-size: 1.05rem; background: var(--accent); color: var(--accent-ink);
  border: 0; border-radius: 12px; padding: 14px 18px; cursor: pointer; margin-top: 4px; }
.primary:disabled { opacity: 0.4; cursor: not-allowed; }
.ghost { background: none; border: 1px dashed var(--line); color: var(--muted); border-radius: 10px; padding: 8px 12px; cursor: pointer; align-self: flex-start; font-size: 0.9rem; }

/* sahne */
.progress { display: flex; gap: 6px; }
.pip { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.pip.on { background: var(--accent); }
.clock { font-family: var(--mono); font-weight: 700; font-size: 3.4rem; line-height: 1; color: var(--fg); font-variant-numeric: tabular-nums; }
.clock.small { font-size: 0.95rem; color: var(--muted); }
.bsod { background: var(--bsod); color: #fff; font-family: "Segoe UI", system-ui, sans-serif; font-size: 0.85rem; line-height: 1.4; padding: 14px; border-radius: 6px; }
.bsod span { display: block; font-size: 2rem; line-height: 1; margin-bottom: 6px; }
.story { font-size: 1.05rem; }
.fact { background: var(--surface); border-left: 3px solid var(--bsod); padding: 12px 14px; border-radius: 0 8px 8px 0; font-size: 0.92rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.fact b { font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--fg); }
.scene-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tag { font-family: var(--mono); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); }
.picked { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
.timer { margin-left: auto; font-family: var(--mono); font-weight: 700; font-variant-numeric: tabular-nums; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.timer::after { content: " sn"; font-weight: 500; color: var(--muted); }
.timer.low { color: var(--bad); border-color: var(--bad); }
.lens { font-size: 0.92rem; color: var(--muted); font-style: italic; border-left: 2px solid var(--line); padding-left: 12px; }
.question { margin-top: 4px; }
.timeout { color: var(--bad); font-size: 0.92rem; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { display: flex; gap: 12px; align-items: flex-start; text-align: left; background: var(--surface); color: var(--fg); border: 1px solid var(--line);
  border-radius: 12px; padding: 14px; cursor: pointer; font-size: 1rem; line-height: 1.35; }
.choice:hover { border-color: var(--accent); }
.letter { font-family: var(--mono); font-weight: 700; color: var(--accent); flex: none; width: 1.5em; }
.hint { background: var(--raise); border-radius: 10px; padding: 12px 14px; font-size: 0.95rem; display: flex; flex-direction: column; gap: 4px; }
.hint b { font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); }
.paper { background: var(--paper); color: var(--paper-ink); font-family: var(--mono); font-size: 0.75rem; padding: 10px 12px; border-radius: 4px; transform: rotate(-0.6deg); }
.paper-row { display: grid; grid-template-columns: 1.2fr 1.2fr 1fr; gap: 6px; padding: 4px 0; border-bottom: 1px dotted #b9b2a0; }
.paper-row.head { font-weight: 700; }
.paper-note { font-size: 0.65rem; text-align: right; opacity: 0.6; margin-top: 4px; }

/* tutor */
.tutor { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-top: 6px; }
.tutor-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--line); font-family: var(--display); }
.tutor-head small { margin-left: auto; font-family: var(--read); color: var(--muted); font-size: 0.78rem; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.thread { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; max-height: 260px; overflow-y: auto; }
.msg { font-size: 0.95rem; padding: 8px 12px; border-radius: 12px; max-width: 88%; }
.msg.tutor { background: var(--raise); align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.me { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
.ask { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
.ask input { flex: 1; min-width: 0; font: inherit; font-size: 0.95rem; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.ask button { background: var(--raise); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; cursor: pointer; }

/* sonuç */
.outcome-title { font-size: 1.6rem; }
.ledger { margin: 0; display: flex; flex-direction: column; gap: 12px; }
.ledger dt { font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); margin-bottom: 2px; }
.ledger dd { margin: 0; }
.ledger .real { background: var(--surface); border-left: 3px solid var(--bsod); padding: 10px 12px; border-radius: 0 8px 8px 0; }
.concept { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.concept b { font-family: var(--display); }

/* son */
.ending h1 { font-size: 1.8rem; }
.tone-iyi .eyebrow { color: var(--good); }
.tone-kötü .eyebrow { color: var(--bad); }
.tone-geç .eyebrow { color: var(--late); }
.trail { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; counter-reset: s; }
.trail li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.95rem; }
.t-tag { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; min-width: 8.5em; }
.pressure { font-style: normal; font-family: var(--mono); font-size: 0.7rem; color: var(--bad); border: 1px solid var(--bad); border-radius: 999px; padding: 0 8px; }
.lessons { display: flex; flex-direction: column; gap: 8px; }
.lesson { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 0.95rem; cursor: pointer; }
.lesson.goal { border-color: var(--accent); }
.lesson b { display: block; font-family: var(--display); }
.lesson input { margin-top: 4px; accent-color: var(--accent); }
.credit { font-size: 0.78rem; color: var(--muted); }

/* v2: veri modu, model müdahalesi, parite */
.veri-band { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.04em; color: var(--accent-ink); background: var(--accent); border-radius: 8px; padding: 6px 10px; }
.kod { font: inherit; font-family: var(--mono); font-size: 1.1rem; text-transform: uppercase; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
.hint-small { color: var(--muted); font-size: 0.8rem; }
.mudahale { border: 1px solid var(--accent); background: var(--raise); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.mudahale b { font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); }
.mudahale small { color: var(--muted); font-size: 0.78rem; }
.model-rozet { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); }
.pressure.tut { color: var(--accent); border-color: var(--accent); }
.veri-kutu { border: 1px dashed var(--accent); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.veri-dugmeler { display: flex; flex-wrap: wrap; gap: 8px; }
.veri-dugmeler .primary { margin-top: 0; }
.kisi-liste { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.kisi-liste li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 0.9rem; }
.durum { color: var(--good); font-size: 0.9rem; min-height: 1.2em; }
.csv-alan { width: 100%; min-height: 140px; font-family: var(--mono); font-size: 0.7rem; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; }
.tehlike summary { color: var(--muted); cursor: pointer; font-size: 0.9rem; }
.tehlike-btn { color: var(--bad); border-color: var(--bad); margin-top: 8px; }
.tablo-kap { overflow-x: auto; }
.parite { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.parite th, .parite td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); }
@media (prefers-reduced-motion: no-preference) {
  .screen { animation: rise 0.28s ease-out; }
  @keyframes rise { from { transform: translateY(6px); opacity: 0.6; } to { transform: none; opacity: 1; } }
}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.min.js"></script>
<script>if (window.ort) ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/";</script>
<script>
/* SE Primer v2 · Küçük, bağımlılıksız ONNX yorumlayıcısı (yedek çıkarım motoru).
   Asıl motor onnxruntime-web'dir. Bu dosya, CDN'e erişilemeyen ortamlarda (çevrimdışı, kısıtlı ağ)
   AYNI model.onnx dosyasını okuyup çalıştırır. Yalnızca bu projedeki küçük modellerin kullandığı
   operatörleri destekler; desteklemediği bir operatörde açıkça hata verir (sessizce yanlış sonuç vermez).
   Desteklenen: Sub, Div, Mul, Add, MatMul, Gemm, Sigmoid, Concat, ArgMax, Cast, Identity, Reshape,
   ai.onnx.ml: Scaler, LinearClassifier, Normalizer. */
(function (root) {
  /* ---------- protobuf okuyucu ---------- */
  function Reader(buf) { this.b = buf; this.p = 0; this.dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength); }
  Reader.prototype.eof = function () { return this.p >= this.b.length; };
  Reader.prototype.varint = function () {
    let r = 0n, s = 0n, x;
    do { x = this.b[this.p++]; r |= BigInt(x & 0x7f) << s; s += 7n; } while (x & 0x80);
    return r;
  };
  Reader.prototype.tag = function () { const t = Number(this.varint()); return [t >>> 3, t & 7]; };
  Reader.prototype.bytes = function () { const n = Number(this.varint()); const v = this.b.subarray(this.p, this.p + n); this.p += n; return v; };
  Reader.prototype.f32 = function () { const v = this.dv.getFloat32(this.p, true); this.p += 4; return v; };
  Reader.prototype.f64 = function () { const v = this.dv.getFloat64(this.p, true); this.p += 8; return v; };
  Reader.prototype.skip = function (w) {
    if (w === 0) this.varint(); else if (w === 1) this.p += 8; else if (w === 2) this.bytes(); else if (w === 5) this.p += 4;
    else throw new Error('protobuf: bilinmeyen tel tipi ' + w);
  };
  const dec = new TextDecoder();
  const str = (u8) => dec.decode(u8);
  const toInt = (b) => { b = BigInt.asIntN(64, b); return Number(b); };

  function packedOr(r, w, one, out) {
    if (w === 2) { const sub = new Reader(r.bytes()); while (!sub.eof()) out.push(one(sub)); }
    else out.push(one(r));
  }

  function parseTensor(u8) {
    const r = new Reader(u8); const t = { dims: [], type: 1, f: [], i: [], d: [], raw: null, name: '' };
    while (!r.eof()) {
      const [f, w] = r.tag();
      if (f === 1) packedOr(r, w, (x) => toInt(x.varint()), t.dims);
      else if (f === 2) t.type = Number(r.varint());
      else if (f === 4) packedOr(r, w, (x) => x.f32(), t.f);
      else if (f === 7) packedOr(r, w, (x) => toInt(x.varint()), t.i);
      else if (f === 10) packedOr(r, w, (x) => x.f64(), t.d);
      else if (f === 8) t.name = str(r.bytes());
      else if (f === 9) t.raw = r.bytes();
      else r.skip(w);
    }
    let data;
    if (t.raw) {
      const ab = t.raw.slice().buffer, n = t.raw.length;
      if (t.type === 1) data = Array.from(new Float32Array(ab, 0, n / 4));
      else if (t.type === 7) data = Array.from(new BigInt64Array(ab, 0, n / 8), Number);
      else if (t.type === 11) data = Array.from(new Float64Array(ab, 0, n / 8));
      else throw new Error('ONNX: desteklenmeyen raw tensör tipi ' + t.type);
    } else data = t.type === 7 ? t.i : t.type === 11 ? t.d : t.f;
    return { name: t.name, dims: t.dims, type: t.type, data };
  }

  function parseAttr(u8) {
    const r = new Reader(u8); const a = { name: '', floats: [], ints: [], strings: [] };
    while (!r.eof()) {
      const [f, w] = r.tag();
      if (f === 1) a.name = str(r.bytes());
      else if (f === 2) a.f = r.f32();
      else if (f === 3) a.i = toInt(r.varint());
      else if (f === 4) a.s = str(r.bytes());
      else if (f === 5) a.t = parseTensor(r.bytes());
      else if (f === 7) packedOr(r, w, (x) => x.f32(), a.floats);
      else if (f === 8) packedOr(r, w, (x) => toInt(x.varint()), a.ints);
      else if (f === 9) a.strings.push(str(r.bytes()));
      else r.skip(w);
    }
    return a;
  }

  function parseNode(u8) {
    const r = new Reader(u8); const n = { input: [], output: [], op: '', domain: '', attr: {} };
    while (!r.eof()) {
      const [f, w] = r.tag();
      if (f === 1) n.input.push(str(r.bytes()));
      else if (f === 2) n.output.push(str(r.bytes()));
      else if (f === 4) n.op = str(r.bytes());
      else if (f === 7) n.domain = str(r.bytes());
      else if (f === 5) { const a = parseAttr(r.bytes()); n.attr[a.name] = a; }
      else r.skip(w);
    }
    return n;
  }

  function parseValueInfoName(u8) { const r = new Reader(u8); while (!r.eof()) { const [f, w] = r.tag(); if (f === 1) return str(r.bytes()); r.skip(w); } return ''; }

  function parseGraph(u8) {
    const r = new Reader(u8); const g = { nodes: [], init: {}, inputs: [], outputs: [] };
    while (!r.eof()) {
      const [f, w] = r.tag();
      if (f === 1) g.nodes.push(parseNode(r.bytes()));
      else if (f === 5) { const t = parseTensor(r.bytes()); g.init[t.name] = t; }
      else if (f === 11) g.inputs.push(parseValueInfoName(r.bytes()));
      else if (f === 12) g.outputs.push(parseValueInfoName(r.bytes()));
      else r.skip(w);
    }
    return g;
  }

  function parseModel(buf) {
    const r = new Reader(buf instanceof Uint8Array ? buf : new Uint8Array(buf));
    let graph = null;
    while (!r.eof()) { const [f, w] = r.tag(); if (f === 7) graph = parseGraph(r.bytes()); else r.skip(w); }
    if (!graph) throw new Error('ONNX: graph bulunamadı');
    return graph;
  }

  /* ---------- tensör yardımcıları (2B'ye kadar, satır öncelikli) ---------- */
  const T = (dims, data) => ({ dims, data });
  const size = (d) => d.reduce((a, b) => a * b, 1);
  function bcast(a, b, fn) {
    const nd = Math.max(a.dims.length, b.dims.length);
    const pa = Array(nd - a.dims.length).fill(1).concat(a.dims), pb = Array(nd - b.dims.length).fill(1).concat(b.dims);
    const od = pa.map((x, i) => Math.max(x, pb[i]));
    const out = new Array(size(od));
    const idx = (p, pd) => { let k = 0, m = 1; for (let i = nd - 1; i >= 0; i--) { k += (pd[i] === 1 ? 0 : p[i]) * m; m *= pd[i]; } return k; };
    for (let n = 0; n < out.length; n++) {
      const p = []; let rem = n; for (let i = nd - 1; i >= 0; i--) { p[i] = rem % od[i]; rem = Math.floor(rem / od[i]); }
      out[n] = fn(a.data[idx(p, pa)], b.data[idx(p, pb)]);
    }
    return T(od, out);
  }
  function matmul(a, b) {
    const [m, k] = a.dims, n = b.dims[1]; const out = new Array(m * n).fill(0);
    for (let i = 0; i < m; i++) for (let j = 0; j < n; j++) { let s = 0; for (let x = 0; x < k; x++) s += a.data[i * k + x] * b.data[x * n + j]; out[i * n + j] = s; }
    return T([m, n], out);
  }
  const f32 = (x) => Math.fround(x);
  const sig = (x) => 1 / (1 + Math.exp(-x));

  const OPS = {
    Identity: (n, [a]) => [a],
    Cast: (n, [a]) => [a],
    Reshape: (n, [a, s]) => { const d = s.data.slice(); const k = d.indexOf(-1); if (k >= 0) d[k] = size(a.dims) / -size(d); return [T(d, a.data)]; },
    Sub: (n, [a, b]) => [bcast(a, b, (x, y) => f32(x - y))],
    Add: (n, [a, b]) => [bcast(a, b, (x, y) => f32(x + y))],
    Mul: (n, [a, b]) => [bcast(a, b, (x, y) => f32(x * y))],
    Div: (n, [a, b]) => [bcast(a, b, (x, y) => f32(x / y))],
    MatMul: (n, [a, b]) => [matmul(a, b)],
    Gemm: (n, [a, b, c]) => {
      const tb = n.attr.transB ? n.attr.transB.i : 0;
      let bb = b; if (tb) { const [r, k] = b.dims; const d = new Array(r * k); for (let i = 0; i < r; i++) for (let j = 0; j < k; j++) d[j * r + i] = b.data[i * k + j]; bb = T([k, r], d); }
      let y = matmul(a, bb); if (c) y = bcast(y, c, (x, z) => x + z); return [y];
    },
    Sigmoid: (n, [a]) => [T(a.dims, a.data.map((x) => f32(sig(x))))],
    Concat: (n, xs) => {
      const ax = n.attr.axis.i; if (ax !== 1 && ax !== -1) throw new Error('Concat: yalnız axis=1');
      const m = xs[0].dims[0]; const cols = xs.reduce((s, x) => s + x.dims[1], 0); const out = [];
      for (let i = 0; i < m; i++) xs.forEach((x) => { for (let j = 0; j < x.dims[1]; j++) out.push(x.data[i * x.dims[1] + j]); });
      return [T([m, cols], out)];
    },
    ArgMax: (n, [a]) => {
      const [m, c] = a.dims; const out = [];
      for (let i = 0; i < m; i++) { let b = 0; for (let j = 1; j < c; j++) if (a.data[i * c + j] > a.data[i * c + b]) b = j; out.push(b); }
      return [T((n.attr.keepdims && n.attr.keepdims.i === 0) ? [m] : [m, 1], out)];
    },
    Scaler: (n, [a]) => {
      const off = n.attr.offset ? n.attr.offset.floats : [0], sc = n.attr.scale ? n.attr.scale.floats : [1]; const c = a.dims[1];
      return [T(a.dims, a.data.map((x, k) => f32((x - off[off.length === 1 ? 0 : k % c]) * sc[sc.length === 1 ? 0 : k % c])))];
    },
    LinearClassifier: (n, [a]) => {
      const C = n.attr.coefficients.floats, B = n.attr.intercepts ? n.attr.intercepts.floats : [];
      const labels = n.attr.classlabels_ints ? n.attr.classlabels_ints.ints : [0, 1];
      const post = n.attr.post_transform ? n.attr.post_transform.s : 'NONE';
      const [m, k] = a.dims; const rows = C.length / k; const lab = [], sc = [];
      for (let i = 0; i < m; i++) {
        let s = []; for (let r = 0; r < rows; r++) { let z = B[r] || 0; for (let j = 0; j < k; j++) z += C[r * k + j] * a.data[i * k + j]; s.push(z); }
        if (post === 'LOGISTIC') s = s.map(sig);
        else if (post === 'SOFTMAX') { const mx = Math.max(...s); const e = s.map((z) => Math.exp(z - mx)); const t = e.reduce((x, y) => x + y, 0); s = e.map((z) => z / t); }
        if (rows === 1) s = [1 - s[0], s[0]];
        sc.push(...s.map(f32));
        lab.push(labels[s.indexOf(Math.max(...s))]);
      }
      return [T([m], lab), T([m, sc.length / m], sc)];
    },
    Normalizer: (n, [a]) => {
      const norm = n.attr.norm ? n.attr.norm.s : 'MAX'; const [m, c] = a.dims; const out = [];
      for (let i = 0; i < m; i++) {
        const row = a.data.slice(i * c, i * c + c);
        const d = norm === 'L1' ? row.reduce((s, x) => s + Math.abs(x), 0) : norm === 'L2' ? Math.sqrt(row.reduce((s, x) => s + x * x, 0)) : Math.max(...row);
        out.push(...row.map((x) => f32(x / d)));
      }
      return [T(a.dims, out)];
    }
  };

  function Session(graph) { this.g = graph; }
  Session.create = async function (src) {
    let buf = src;
    if (typeof src === 'string') { const r = await fetch(src); if (!r.ok) throw new Error('model indirilemedi: ' + r.status); buf = new Uint8Array(await r.arrayBuffer()); }
    return new Session(parseModel(buf));
  };
  /* feeds: { input: { dims:[n,f], data:[...] } } → { label, probabilities } */
  Session.prototype.run = function (feeds) {
    const env = {};
    for (const [k, t] of Object.entries(this.g.init)) env[k] = T(t.dims, t.data);
    for (const [k, v] of Object.entries(feeds)) env[k] = T(v.dims, Array.from(v.data, f32));
    for (const n of this.g.nodes) {
      const fn = OPS[n.op]; if (!fn) throw new Error('ONNX mini: desteklenmeyen operatör ' + (n.domain ? n.domain + '.' : '') + n.op);
      const outs = fn(n, n.input.map((x) => (x ? env[x] : null)));
      n.output.forEach((o, i) => { if (o) env[o] = outs[i]; });
    }
    const res = {}; this.g.outputs.forEach((o) => { res[o] = env[o]; }); return res;
  };

  const api = { Session, parseModel };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.OnnxMini = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* SE Primer v2 · Telemetri ve veri toplama modu.
   Her karar bir satır (data/oturumlar.csv ile aynı sütunlar, bkz. data/SOZLUK.md).
   KVKK: ad, e-posta, cihaz kimliği, konum, IP TOPLANMAZ. Oturum kimliği rastgele üretilir.
   Veriler yalnızca bu cihazdaki tarayıcıda (localStorage) durur; dışarı ancak oyunu yöneten kişi
   "CSV indir / Kopyala" ile çıkarır. */
(function (root) {
  const KEY = 'se-primer-veri-v2';
  const SURUM = 'app-2.0';

  const SUTUNLAR = [
    'oturum_id', 'oyuncu_kodu', 'oturum_no', 'kaynak', 'surum', 'tarih',
    'seviye', 'rol', 'hedef', 'sahne_no', 'riskli_ustte',
    'onceki_sahne_sure_sn', 'onceki_karar_sure_sn', 'onceki_riskli_sayisi',
    'tutor_mesaj_onceki', 'ipucu_acma_onceki',
    'karar_sure_sn', 'tutor_mesaj_bu_sahne', 'sure_doldu',
    'model_p', 'model_mudahale', 'riskli_secti'
  ];

  // Modelin girdi olarak kullandığı, karar ekranı AÇILDIĞI ANDA bilinen sütunlar (sıra = model sözleşmesi).
  const OZELLIKLER = [
    'seviye', 'sahne_no', 'oturum_no', 'onceki_sahne_sure_sn', 'onceki_karar_sure_sn',
    'onceki_riskli_sayisi', 'tutor_mesaj_onceki', 'ipucu_acma_onceki'
  ];

  const SEVIYE_KOD = { yeni: 0, orta: 1, deneyimli: 2 };

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || '{"satirlar":[],"oyuncular":{}}'); }
    catch (e) { return { satirlar: [], oyuncular: {} }; }
  }
  function save(db) { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }

  function rastgeleId() {
    const a = new Uint8Array(4);
    (root.crypto || {}).getRandomValues ? root.crypto.getRandomValues(a) : a.forEach((_, i) => { a[i] = Math.random() * 256; });
    return Array.from(a, (b) => b.toString(16).padStart(2, '0')).join('');
  }

  const r1 = (x) => Math.round(x * 10) / 10;

  /* Bir oturumun canlı ölçümleri. */
  function yeniOturum(oyuncuKodu, profil) {
    const db = load();
    const kod = (oyuncuKodu || '').trim().toUpperCase().slice(0, 8) || null;
    let no = 1;
    if (kod) { no = (db.oyuncular[kod] || 0) + 1; }
    return {
      id: rastgeleId(), kod, no, profil,
      ekranAcildi: Date.now(), oncekiEkranSure: 0, oncekiKararSure: 0, riskliSayisi: 0,
      tutorToplam: 0, tutorBuSahne: 0, ipucuToplam: 0, satirlar: []
    };
  }

  /* Karar ekranı açılırken çağrılır: modelin göreceği özellikleri döndürür. */
  function kararEkraniAcildi(o, sahneNo) {
    const simdi = Date.now();
    o.oncekiEkranSure = r1((simdi - o.ekranAcildi) / 1000);
    o.ekranAcildi = simdi;
    o.tutorOnceki = o.tutorToplam;
    o.ipucuOnceki = o.ipucuToplam;
    o.tutorBuSahne = 0;
    return {
      seviye: SEVIYE_KOD[o.profil.level],
      sahne_no: sahneNo,
      oturum_no: o.no,
      onceki_sahne_sure_sn: o.oncekiEkranSure,
      onceki_karar_sure_sn: o.oncekiKararSure,
      onceki_riskli_sayisi: o.riskliSayisi,
      tutor_mesaj_onceki: o.tutorOnceki,
      ipucu_acma_onceki: o.ipucuOnceki
    };
  }

  function tutorMesaji(o) { if (o) { o.tutorToplam++; o.tutorBuSahne++; } }
  function ipucuAcildi(o) { if (o) o.ipucuToplam++; }

  /* Seçim yapılınca: satırı tamamla. riskli = B seçeneği (her kararda daha kötü sonuçlanan yol). */
  function secimYapildi(o, ozellikler, ek) {
    const simdi = Date.now();
    const sure = r1((simdi - o.ekranAcildi) / 1000);
    const riskli = ek.secim === 'B' ? 1 : 0;
    const satir = Object.assign({
      oturum_id: o.id, oyuncu_kodu: o.kod || '', oturum_no: o.no, kaynak: 'gercek', surum: SURUM,
      tarih: new Date().toISOString().slice(0, 10),
      rol: o.profil.role, hedef: o.profil.goal, riskli_ustte: ek.riskliUstte ? 1 : 0,
      karar_sure_sn: sure, tutor_mesaj_bu_sahne: o.tutorBuSahne, sure_doldu: ek.sureDoldu ? 1 : 0,
      model_p: ek.modelP == null ? '' : Math.round(ek.modelP * 10000) / 10000,
      model_mudahale: ek.mudahale ? 1 : 0, riskli_secti: riskli
    }, ozellikler);
    o.satirlar.push(satir);
    o.oncekiKararSure = sure;
    o.riskliSayisi += riskli;
    o.ekranAcildi = simdi;
    return satir;
  }

  /* Oturum sona erince (veri modunda) kalıcı kayda yaz. Yarım kalan oturum kaydedilmez. */
  function oturumuKaydet(o) {
    if (!o || o.satirlar.length === 0) return 0;
    const db = load();
    db.satirlar.push(...o.satirlar);
    if (o.kod) db.oyuncular[o.kod] = o.no;
    save(db);
    return o.satirlar.length;
  }

  function ozet() {
    const db = load();
    const oturumlar = new Set(db.satirlar.map((s) => s.oturum_id));
    const kisi = {};
    db.satirlar.forEach((s) => { const k = s.oyuncu_kodu || '?'; kisi[k] = kisi[k] || new Set(); kisi[k].add(s.oturum_id); });
    return { satir: db.satirlar.length, oturum: oturumlar.size, kisi: Object.fromEntries(Object.entries(kisi).map(([k, v]) => [k, v.size])) };
  }

  function csv() {
    const db = load();
    const esc = (v) => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    return [SUTUNLAR.join(',')].concat(db.satirlar.map((s) => SUTUNLAR.map((c) => esc(s[c])).join(','))).join('\n') + '\n';
  }

  function sil() { try { localStorage.removeItem(KEY); } catch (e) {} }

  const api = { SUTUNLAR, OZELLIKLER, SURUM, yeniOturum, kararEkraniAcildi, tutorMesaji, ipucuAcildi, secimYapildi, oturumuKaydet, ozet, csv, sil };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Telemetri = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* SE Primer v2 · Modelin uygulamadaki tüketicisi (çıkarım / inference).
   Sözleşme: model/config.json → features (sıra), classes, karar_esigi.
   Model dosyası önce Hugging Face'teki COMMIT'E SABİTLENMİŞ URL'den, olmazsa sitedeki kopyadan alınır.
   Motor: onnxruntime-web (asıl); yüklenemezse OnnxMini (aynı model.onnx'i okuyan yedek motor). */
(function (root) {
  const KAYNAK = root.SE_PRIMER_MODEL || {
    // RELEASE.md ile aynı tutulur. Commit değişmeden model değişmez (sürüm sabitleme).
    hf: null,          // ör. 'https://huggingface.co/<kullanici>/se-primer-risk/resolve/<commit>/'
    yerel: 'model/'    // GitHub Pages'teki kopya (yedek)
  };

  const durum = { hazir: false, motor: null, kaynak: null, config: null, hata: null, oturum: null };
  let yukleniyor = null;

  const q = new URLSearchParams(root.location ? root.location.search : '');

  async function jsonAl(url) { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error(url + ' ' + r.status); return r.json(); }

  async function oturumAc(taban) {
    const config = await jsonAl(taban + 'config.json');
    const zorlaMini = q.get('motor') === 'mini';
    if (!zorlaMini && root.ort && root.ort.InferenceSession) {
      try {
        const s = await root.ort.InferenceSession.create(taban + 'model.onnx');
        return { config, motor: 'onnxruntime-web', run: async (x) => {
          const t = new root.ort.Tensor('float32', Float32Array.from(x), [1, x.length]);
          const out = await s.run({ input: t });
          return Array.from(out.probabilities.data);
        } };
      } catch (e) { /* yedek motora düş */ }
    }
    const s = await root.OnnxMini.Session.create(taban + 'model.onnx');
    return { config, motor: 'onnx-mini (yedek)', run: async (x) => Array.from(s.run({ input: { dims: [1, x.length], data: x } }).probabilities.data) };
  }

  function yukle() {
    if (yukleniyor) return yukleniyor;
    yukleniyor = (async () => {
      if (q.get('model') === 'kapali') { durum.hata = 'kapalı (?model=kapali)'; return durum; }
      const adaylar = [KAYNAK.hf, KAYNAK.yerel].filter(Boolean);
      for (const taban of adaylar) {
        try {
          const o = await oturumAc(taban);
          Object.assign(durum, { hazir: true, motor: o.motor, kaynak: taban, config: o.config, oturum: o });
          return durum;
        } catch (e) { durum.hata = String(e.message || e); }
      }
      return durum;
    })();
    return yukleniyor;
  }

  function esik() {
    const e = q.get('esik');
    if (e !== null && e !== '' && !isNaN(+e)) return +e;
    return durum.config && typeof durum.config.karar_esigi === 'number' ? durum.config.karar_esigi : 0.5;
  }

  /* ozellikler: { ad: değer } → riskli seçim olasılığı (sınıf "1") */
  async function tahmin(ozellikler) {
    await yukle();
    if (!durum.hazir) return null;
    const x = durum.config.features.map((f) => {
      const v = ozellikler[f.name];
      if (typeof v !== 'number' || !isFinite(v)) throw new Error('sözleşme ihlali: eksik özellik ' + f.name);
      return v;
    });
    const p = await durum.oturum.run(x);
    const i = durum.config.classes.indexOf('1');
    return p[i < 0 ? p.length - 1 : i];
  }

  const api = { yukle, tahmin, esik, durum };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.RiskModeli = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

<script>
/* SE Primer · Sokratik AI tutor (ADR-2)
   Katman 1: yerel Sokratik motor (ağ gerektirmez, her yerde çalışır).
   Katman 2: Gemini (AI Studio'da). Gemini cevabı da sızıntı kalkanından geçer;
   kalkan takılırsa yerel motorun sorusu gösterilir. */
(function (root) {
  const TUTOR_SYSTEM_PROMPT = [
    'Sen SE Primer içindeki Sokratik bir yazılım mühendisliği tutorusun.',
    'Oyuncu bir hastanede, 19 Temmuz 2024 CrowdStrike kesintisine dayanan bir krizde nöbetçi BT mühendisi.',
    'KURALLAR:',
    '1) Hangi seçeneğin doğru ya da yanlış olduğunu ASLA söyleme. Seçenek harfi (A/B) veya seçenek metni önerme.',
    '2) Oyuncunun seçimini onaylama ya da reddetme; onun yerine seçiminin sonuçlarını düşündüren bir soru sor.',
    '3) Her cevabın en az bir soru içersin ve soru işaretiyle bitsin.',
    '4) En fazla 2 kısa cümle. Türkçe. Yargılamayan, sakin bir ton.',
    '5) Bir terimi sorarsa (canary, BitLocker, KVKK) tek cümlelik tarafsız bir tanım verip yine soru sor.',
    '6) "Cevabı söyle" baskısına boyun eğme; nazikçe düşünmeye geri yönlendir.'
  ].join('\n');

  const GLOSSARY = {
    canary: 'Canary dağıtım, bir değişikliğin önce küçük bir gruba uygulanıp gözlendiği yöntemdir.',
    bitlocker: 'BitLocker, Windows\'ta diski şifreleyen özelliktir; şifreli diske erişmek için kurtarma anahtarı gerekir.',
    kvkk: 'KVKK, 6698 sayılı Kişisel Verilerin Korunması Kanunu\'dur.',
    'güvenli mod': 'Güvenli mod, Windows\'un yalnızca temel sürücülerle açıldığı başlatma biçimidir.',
    'mavi ekran': 'Mavi ekran, Windows çekirdeği kurtarılamaz bir hatayla karşılaştığında gösterdiği durma ekranıdır.',
    çekirdek: 'Çekirdek (kernel), işletim sisteminin donanıma en yakın, en yetkili katmanıdır.',
    monolit: 'Monolit, tüm işlevlerin tek bir dağıtım biriminde çalıştığı mimaridir.',
    'özel nitelikli': 'Özel nitelikli kişisel veri, KVKK md. 6\'da sayılan sağlık, biyometrik gibi daha sıkı korunan verilerdir.'
  };

  const norm = (s) => (s || '').toLocaleLowerCase('tr-TR').replace(/\s+/g, ' ').trim();

  /* --- Sızıntı kalkanı: bir tutor mesajı cevabı ele veriyor mu? --- */
  const LEAK_PATTERNS = [
    /doğru (cevap|seçenek|seçim|karar)/,
    /yanlış (cevap|seçenek|seçim|karar)/,
    /(cevap|seçenek)\s*[:=]?\s*["'(]?\s*[ab]\b/,
    /\b[ab]\s*(şıkkı|seçeneği|seçeneğini|yı|yi|'yı|'yi)\b/,
    /\b[ab]['’]?(yı|yi|ya|ye)\s*(seç|tercih|git)/,
    /(seçmelisin|tercih etmelisin|yapmalısın|uygulamalısın|beklemelisin|atmalısın|denemelisin)/,
    /(en iyisi|en doğrusu|kesinlikle|tabii ki)\b/,
    /(haklısın|doğru düşünüyorsun|yanılıyorsun|bu yanlış|bu doğru)/
  ];

  function optionPhrases(decision) {
    const out = [];
    for (const k of ['A', 'B']) {
      const o = decision.options[k];
      out.push(norm(o.label), norm(o.short));
    }
    return out;
  }

  function leakCheck(text, decision) {
    const t = norm(text);
    const reasons = [];
    LEAK_PATTERNS.forEach((p, i) => { if (p.test(t)) reasons.push('desen-' + (i + 1)); });
    if (decision) {
      for (const ph of optionPhrases(decision)) {
        if (ph.length > 8 && t.includes(ph)) reasons.push('seçenek-metni');
      }
    }
    return { leak: reasons.length > 0, reasons };
  }

  /* --- Öğrenci mesajını sınıflandır --- */
  function classify(text, decision) {
    const t = norm(text);
    if (!t) return 'empty';
    for (const term of Object.keys(GLOSSARY)) {
      if (t.includes(term) && /(ne demek|nedir|ne\b|anlamadım|ne işe)/.test(t)) return 'concept:' + term;
    }
    if (/(cevap|hangisi|söyle|doğru(su)?\s*(ne|hangi)|a m[ıi] b m[ıi]|ne seçmeliyim|ne yapmalıyım|yardım et|ipucu ver)/.test(t)) return 'ask-answer';
    // v2: öğrencinin kendi içerik sorusu (eval #20'de duyulmuyordu)
    if (/\?/.test(t) && /(mı|mi|mu|mü|nasıl|neden|niye|kim|hangi)(?=[\s?.,!]|$)/.test(t)) return 'student-question';
    // v3: telefonda "?" yazılmadan sorulan soru (kullanıcı testi: "tc kimlik numarası yetmez mi")
    if (/\s(mı|mi|mu|mü)(yım|yim|yum|yüm|sın|sin|sun|sün|yız|yiz|yuz|yüz|dır|dir|dur|dür)?[.!]*$/.test(t)) return 'student-question';
    if (/(bilmiyorum|emin değilim|kararsız|anlamadım|fikrim yok)/.test(t)) return 'unsure';
    if (/(^|\s)(a|b)(\s|$|[.,!?])/.test(t) || /(seçerim|seçtim|yaparım|derim|giderim|uygularım|beklerim|atarım|denerim|maskelerim)/.test(t)) return 'choice';
    const topicWords = ['makine', 'script', 'acil', 'ameliyat', 'test', 'dene', 'hepsi', 'bekle', 'kurtar', 'liste', 'fotoğraf', 'whatsapp', 'maske', 'veri', 'hasta', 'güncelleme', 'ekip', 'öncelik', 'risk', 'dosya', 'bitlocker', 'kvkk', 'tc', 't.c'];
    if (topicWords.some((w) => t.includes(w))) return 'reasoning';
    return 'off-topic';
  }

  function pick(list, used) {
    const fresh = list.filter((q) => !used.includes(q));
    return (fresh.length ? fresh : list)[0];
  }

  /* --- Katman 1: yerel Sokratik motor --- */
  function localReply(decision, studentText, profile, used) {
    used = used || [];
    const kind = classify(studentText, decision);
    const beginner = profile && profile.level === 'yeni';
    const q = pick(decision.socratic, used);
    let msg;
    if (kind.startsWith('concept:')) {
      const term = kind.slice(8);
      msg = GLOSSARY[term] + ' Bunu bildiğinde, bu durumda neyi farklı görüyorsun?';
    } else if (kind === 'ask-answer') {
      msg = (beginner
        ? 'Cevabı söylemeyeceğim, çünkü bu kararı sen vereceksin; ama birlikte düşünebiliriz. '
        : 'Kararı ben vermeyeceğim. ') + q;
    } else if (kind === 'unsure') {
      msg = 'Kararsız kalmak normal; küçük bir adımla başlayalım. ' + q;
    } else if (kind === 'student-question') {
      const asked = String(studentText).trim().replace(/\s+/g, ' ').slice(0, 90);
      msg = '"' + asked + '" diye sorman önemli. Bunu bu sahnede kimden ya da neyden öğrenebilirsin, ve öğrendiğin şey seçimini nasıl değiştirir?';
    } else if (kind === 'choice') {
      // v2: tek soru (v1'de iki soru üst üste geliyordu)
      msg = 'Bu yolu seçersen, ilk 10 dakikada ne olacağını ve bunu nasıl gözlemleyeceğini düşündün mü?';
    } else if (kind === 'reasoning') {
      msg = 'Gerekçeni görüyorum. Bunu bir adım ileri götürelim: ' + q;
    } else if (kind === 'empty') {
      msg = q;
    } else {
      msg = 'Sahneye dönelim. ' + q;
    }
    return { text: msg, kind, question: q, source: 'local' };
  }

  /* --- Katman 2: Gemini (yalnızca anahtar varsa; AI Studio'da process.env.API_KEY) --- */
  async function geminiReply(decision, studentText, profile, apiKey) {
    const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + encodeURIComponent(apiKey);
    const ctx = 'Sahne: ' + decision.situation + '\nSoru: ' + decision.question +
      '\nSeçenekler (ASLA önerme): A) ' + decision.options.A.label + ' B) ' + decision.options.B.label +
      '\nOyuncu profili: seviye=' + profile.level + ', rol=' + profile.role + ', hedef=' + profile.goal;
    const body = {
      systemInstruction: { parts: [{ text: TUTOR_SYSTEM_PROMPT }] },
      contents: [{ role: 'user', parts: [{ text: ctx + '\n\nOyuncunun mesajı: ' + studentText }] }],
      generationConfig: { temperature: 0.4, maxOutputTokens: 120 }
    };
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json();
    return (j.candidates && j.candidates[0].content.parts.map((p) => p.text).join('')) || '';
  }

  async function reply(decision, studentText, profile, used, apiKey) {
    const local = localReply(decision, studentText, profile, used);
    if (!apiKey) return local;
    try {
      const g = await geminiReply(decision, studentText, profile, apiKey);
      const chk = leakCheck(g, decision);
      if (!g || chk.leak || !g.includes('?')) return Object.assign(local, { source: 'local(kalkan)', blocked: g });
      return { text: g.trim(), kind: local.kind, question: local.question, source: 'gemini' };
    } catch (e) {
      return Object.assign(local, { source: 'local(ağ yok)' });
    }
  }

  function firstQuestion(decision, profile) {
    const STORY = root.STORY || (typeof require !== 'undefined' ? require('./story.js').STORY : null);
    const goalDecision = STORY && STORY.goalLessons[profile.goal];
    const q = decision.socratic[decision.id === goalDecision ? 3 : 0];
    return q;
  }

  const api = { TUTOR_SYSTEM_PROMPT, GLOSSARY, classify, localReply, reply, leakCheck, firstQuestion };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Tutor = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const h = (html) => { app.innerHTML = html; app.scrollTop = 0; window.scrollTo(0, 0); };

  function stopTimer() { if (state.timerId) { clearInterval(state.timerId); state.timerId = null; } }

  function progressBar() {
    const total = S.decisions.length;
    const done = state.screen === 'ending' ? total : Math.min(state.step + (state.screen === 'outcome' ? 1 : 0), total);
    let dots = '';
    for (let i = 0; i < total; i++) dots += '<span class="pip ' + (i < done ? 'on' : '') + '"></span>';
    return '<div class="progress" aria-label="İlerleme: ' + done + '/' + total + '">' + dots + '</div>';
  }

  const veriBandi = () => (VERI_MODU ? '<div class="veri-band" data-cy="veri-band">Veri toplama modu · kararlar anonim olarak bu cihazda kaydediliyor</div>' : '');

  /* ---------- Ekran 1: Profil ---------- */
  function renderProfile() {

      const g = S.profile[key];
      return '<fieldset class="group"><legend>' + esc(g.label) + '</legend><div class="chips">' +
        g.options.map((o) => '<button type="button" class="chip ' + (state.profile[key] === o.id ? 'sel' : '') + '" data-key="' + key + '" data-val="' + o.id + '" data-cy="opt-' + key + '-' + o.id + '" aria-pressed="' + (state.profile[key] === o.id) + '">' +
          '<span>' + esc(o.label) + '</span>' + (o.note ? '<small>' + esc(o.note) + '</small>' : '') + '</button>').join('') +
        '</div></fieldset>';
    };
    const kodBlok = VERI_MODU
      ? '<fieldset class="group"><legend>Oyuncu kodu</legend><input id="oyuncu-kodu" data-cy="oyuncu-kodu" class="kod" maxlength="8" autocomplete="off" placeholder="ör. O1" value="' + esc(state.oyuncuKodu) + '">' +
        '<small class="hint-small">Ad yazma. Aynı kişi her oyunda aynı kodu kullansın (O1, O2, O3).</small></fieldset>'
      : '';
    const ready = state.profile.level && state.profile.role && state.profile.goal && (!VERI_MODU || state.oyuncuKodu.trim());
    h('<main class="screen profile" data-cy="screen-profile">' + veriBandi() +
      '<header class="cover"><p class="eyebrow">SE Primer · Bölüm 1</p>' +
      '<h1>' + esc(S.title) + '</h1><p class="sub">' + esc(S.subtitle) + '</p>' +
      '<p class="based">Gerçek olaya dayanır: ' + esc(S.realEvent) + '</p></header>' +
      '<p class="lead">Bu kitap sana göre yazılır. Üç soru:</p>' +
      kodBlok + group('level') + group('role') + group('goal') +
      '<button class="primary" data-cy="start" ' + (ready ? '' : 'disabled') + '>Bölümü başlat</button>' +
      (VERI_MODU ? '<button class="ghost" data-cy="veri-paneli">Toplanan veriyi gör</button>' : '') +
      '</main>');
    app.querySelectorAll('.chip').forEach((b) => b.addEventListener('click', () => {
      state.profile[b.dataset.key] = b.dataset.val;
      renderProfile();
    }));
    const kod = app.querySelector('#oyuncu-kodu');
    if (kod) kod.addEventListener('input', () => {
      state.oyuncuKodu = kod.value;
      const ok = state.profile.level && state.profile.role && state.profile.goal && kod.value.trim();
      app.querySelector('[data-cy=start]').disabled = !ok;
    });
    const vp = app.querySelector('[data-cy=veri-paneli]');
    if (vp) vp.addEventListener('click', () => { state.screen = 'veri'; render(); });
    app.querySelector('[data-cy=start]').addEventListener('click', () => {
      try { if (!VERI_MODU) localStorage.setItem('se-primer-profile', JSON.stringify(state.profile)); } catch (e) {}
      state.oturum = TEL.yeniOturum(state.oyuncuKodu, Object.assign({}, state.profile));
      state.feats = {}; state.order = {}; state.model = {}; state.kaydedildi = false;
      if (!VERI_MODU) M.yukle();
      state.screen = 'intro'; render();
    });
  }

  /* ---------- Giriş sahnesi ---------- */
  function renderIntro() {
    h('<main class="screen scene" data-cy="screen-intro">' + veriBandi() + progressBar() +
      '<div class="clock" aria-label="Saat">' + esc(S.intro.clock) + '</div>' +
      '<div class="bsod" aria-hidden="true"><span>:(</span> Bilgisayarınız bir sorunla karşılaştı ve yeniden başlatılması gerekiyor.</div>' +
      S.intro.text.map((p) => '<p class="story">' + esc(p) + '</p>').join('') +
      '<aside class="fact"><b>Gerçek olay</b>' + esc(S.intro.fact) + '</aside>' +
      '<button class="primary" data-cy="intro-next">İlk karara geç</button></main>');
    app.querySelector('[data-cy=intro-next]').addEventListener('click', () => { state.screen = 'decision'; state.step = 0; render(); });
  }

  /* ---------- Ekran 2: Karar sahnesi ---------- */
  function hintHtml(d) {
    const lvl = state.profile.level;
    if (lvl !== 'yeni' && lvl !== 'orta') return '';
    const open = lvl === 'yeni' || state.hintOpen;
    return (lvl === 'orta' ? '<button class="ghost" data-cy="hint-toggle" aria-expanded="' + open + '">' + (open ? 'İpucunu gizle' : 'İpucu göster') + '</button>' : '') +
      (open ? '<div class="hint" data-cy="hint-panel"><b>İpucu</b>' + esc(d.hint) + '</div>' : '');
  }
  function wireHint(d) {
    const tg = app.querySelector('[data-cy=hint-toggle]');
    if (tg) tg.addEventListener('click', () => {
      state.hintOpen = !state.hintOpen;
      if (state.hintOpen) TEL.ipucuAcildi(state.oturum);
      app.querySelector('#ipucu-slot').innerHTML = hintHtml(d);
      wireHint(d);
    });
  }

  function renderDecision() {
    stopTimer();
    const d = S.decisions[state.step];
    const lvl = state.profile.level;
    const timed = lvl === 'deneyimli';
    state.timerLeft = 60;
    if (!state.feats[d.id]) state.feats[d.id] = TEL.kararEkraniAcildi(state.oturum, state.step + 1);
    if (!state.order[d.id]) state.order[d.id] = (SIRA_SABIT || Math.random() < 0.5) ? ['A', 'B'] : ['B', 'A'];

    const sample = d.sample ? '<div class="paper" aria-label="Ameliyat listesi örneği (sahte veri)"><div class="paper-row head"><span>Hasta</span><span>T.C. no</span><span>Tanı</span></div>' +
      '<div class="paper-row"><span>Ayşe Kaya</span><span>12345678901</span><span>' + esc(d.sample.dx) + '</span></div>' +
      '<div class="paper-row"><span>Mehmet Demir</span><span>23456789012</span><span>Herni onarımı</span></div><p class="paper-note">Sahte veri</p></div>' : '';

    h('<main class="screen scene" data-cy="decision-' + d.id + '">' + veriBandi() + progressBar() +
      '<div class="scene-head"><span class="tag">' + esc(d.tag) + '</span><span class="clock small">' + esc(d.clock) + '</span>' +
      (timed ? '<span class="timer" data-cy="timer" role="timer" aria-live="off">60</span>' : '') + '</div>' +
      '<p class="story">' + esc(d.situation) + '</p>' + sample +
      '<p class="lens" data-cy="role-lens">' + esc(d.roleLens[state.profile.role]) + '</p>' +
      '<div id="mudahale-slot"></div>' +
      '<h2 class="question">' + esc(d.question) + '</h2>' +
      '<div class="timeout" data-cy="timeout-msg" hidden>Süre doldu. Karar yine senin; ama bu karar raporda "süre baskısı" olarak görünecek.</div>' +
      '<div class="choices">' +
      state.order[d.id].map((k, i) => '<button class="choice" data-cy="choice-' + k + '" data-k="' + k + '"><span class="letter">' + 'AB'[i] + '</span><span>' + esc(d.options[k].label) + '</span></button>').join('') +
      '</div><div id="ipucu-slot">' + hintHtml(d) + '</div>' +
      tutorPanel(d) +
      '<p class="model-rozet" data-cy="model-rozet" hidden></p>' +
      '</main>');

    app.querySelectorAll('.choice').forEach((b) => b.addEventListener('click', () => choose(b.dataset.k)));
    wireHint(d);
    wireTutor(d);
    if (!VERI_MODU) uygulaModel(d);

    if (timed) {
      const el = app.querySelector('[data-cy=timer]');
      state.timerId = setInterval(() => {
        state.timerLeft -= 1;
        el.textContent = String(Math.max(state.timerLeft, 0));
        if (state.timerLeft <= 10) el.classList.add('low');
        if (state.timerLeft <= 0) {
          stopTimer();
          state.pressured[d.id] = true;
          el.textContent = '0';
          app.querySelector('[data-cy=timeout-msg]').hidden = false;
        }
      }, 1000);
    }
  }

  /* Model: "Bu oyuncu bu kararda riskli seçeneğe gidecek mi?" Olasılık eşiği geçerse tutor
     cevabı söylemeden, karar vermeden ÖNCE devreye girer; 'orta' seviyede ipucu kendiliğinden açılır. */
  function uygulaModel(d) {
    const id = d.id;
    const goster = (p) => {
      if (state.screen !== 'decision' || S.decisions[state.step].id !== id) return;
      const esik = M.esik();
      const mud = p !== null && p >= esik;
      state.model[id] = { p, mudahale: mud };
      const rozet = app.querySelector('[data-cy=model-rozet]');
      if (rozet) {
        rozet.hidden = false;
        rozet.textContent = p === null ? 'Uyum modeli: kullanılamıyor (' + (M.durum.hata || 'yüklenemedi') + '), kural tabanlı akış'
          : 'Uyum modeli · riskli seçim olasılığı ' + Math.round(p * 100) + '% · eşik ' + Math.round(esik * 100) + '% · ' + (mud ? 'tutor devreye girdi' : 'müdahale yok');
      }
      if (!mud) return;
      const soru = T.firstQuestion(d, state.profile);
      const alt = d.socratic.find((x) => x !== soru) || soru;
      app.querySelector('#mudahale-slot').innerHTML =
        '<aside class="mudahale" data-cy="model-mudahale"><b>Seçmeden önce bir dakika</b>' +
        '<p>' + esc(alt) + '</p><small>Bu soruyu, senin gibi oynayanların bu noktada sık yanıldığını gören model gösteriyor. Cevabı söylemez.</small></aside>';
      if (state.profile.level === 'orta' && !state.hintOpen) {
        state.hintOpen = true;
        app.querySelector('#ipucu-slot').innerHTML = hintHtml(d);
        wireHint(d);
      }
    };
    M.tahmin(state.feats[id]).then(goster).catch((e) => { M.durum.hata = String(e.message || e); goster(null); });
  }

  function tutorPanel(d) {
    const log = state.tutorLog.filter((m) => m.d === d.id);
    const first = T.firstQuestion(d, state.profile);
    const msgs = [{ who: 'tutor', text: first }].concat(log);
    return '<section class="tutor" aria-label="Tutor">' +
      '<div class="tutor-head"><span class="dot" aria-hidden="true"></span><b>Tutor</b><small>Cevabı söylemez, soru sorar</small></div>' +
      '<div class="thread" data-cy="tutor-thread">' +
      msgs.map((m) => '<p class="msg ' + m.who + '" ' + (m.who === 'tutor' ? 'data-cy="tutor-msg"' : 'data-cy="me-msg"') + '>' + esc(m.text) + '</p>').join('') +
      '</div><form class="ask" data-cy="tutor-form"><label for="tutor-input-' + d.id + '" class="sr">Tutor\'a yaz</label>' +
      '<input id="tutor-input-' + d.id + '" data-cy="tutor-input" placeholder="Düşündüğünü yaz ya da soru sor" autocomplete="off">' +
      '<button data-cy="tutor-send" type="submit">Gönder</button></form></section>';
  }

  function wireTutor(d) {
    const form = app.querySelector('[data-cy=tutor-form]');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = form.querySelector('input');
      const text = input.value.trim();
      if (!text) return;
      state.tutorLog.push({ d: d.id, who: 'me', text });
      TEL.tutorMesaji(state.oturum);
      const used = state.usedQuestions.concat([T.firstQuestion(d, state.profile)]);
      const r = await T.reply(d, text, state.profile, used, GEMINI_KEY);
      state.usedQuestions.push(r.question);
      state.tutorLog.push({ d: d.id, who: 'tutor', text: r.text });
      const thread = app.querySelector('[data-cy=tutor-thread]');
      thread.insertAdjacentHTML('beforeend', '<p class="msg me" data-cy="me-msg">' + esc(text) + '</p><p class="msg tutor" data-cy="tutor-msg">' + esc(r.text) + '</p>');
      input.value = '';
      thread.lastElementChild.scrollIntoView({ block: 'nearest' });
    });
  }

  function choose(k) {
    stopTimer();
    const d = S.decisions[state.step];
    state.choices[d.id] = k;
    const m = state.model[d.id] || {};
    TEL.secimYapildi(state.oturum, state.feats[d.id], {
      secim: k, riskliUstte: state.order[d.id][0] === 'B', sureDoldu: !!state.pressured[d.id],
      modelP: m.p == null ? null : m.p, mudahale: !!m.mudahale
    });
    state.screen = 'outcome';
    render();
  }

  /* ---------- Sonuç kartı ---------- */
  function renderOutcome() {
    const d = S.decisions[state.step];
    const k = state.choices[d.id];
    const o = d.outcomes[k];
    const last = state.step === S.decisions.length - 1;
    h('<main class="screen scene" data-cy="outcome">' + veriBandi() + progressBar() +
      '<div class="scene-head"><span class="tag">' + esc(d.tag) + '</span><span class="picked">Seçimin: ' + esc(d.options[k].short) + '</span></div>' +
      '<h2 class="outcome-title" data-cy="outcome-title">' + esc(o.title) + '</h2>' +
      '<dl class="ledger">' +
      '<div><dt>Ne oldu?</dt><dd>' + esc(o.what) + '</dd></div>' +
      '<div><dt>Neden oldu?</dt><dd>' + esc(o.why) + '</dd></div>' +
      '<div class="real"><dt>Gerçekte ne oldu?</dt><dd>' + esc(o.real) + '</dd></div>' +
      '</dl>' +
      '<div class="concept"><b>' + esc(d.lesson.term) + '</b><p>' + esc(d.lesson.text) + '</p></div>' +
      '<button class="primary" data-cy="outcome-next">' + (last ? 'Sonu gör' : 'Sonraki karar') + '</button></main>');
    app.querySelector('[data-cy=outcome-next]').addEventListener('click', () => {
      if (last) state.screen = 'ending';
      else { state.step += 1; state.screen = 'decision'; state.hintOpen = false; }
      render();
    });
  }

  /* ---------- Ekran 3: Son ---------- */
  function renderEnding() {
    const code = window.decideEnding(state.choices);
    const e = S.endings[code];
    const goalId = S.goalLessons[state.profile.goal];
    const ordered = S.decisions.slice().sort((a, b) => (a.id === goalId ? -1 : b.id === goalId ? 1 : 0));
    let veriKutu = '';
    if (VERI_MODU) {
      if (!state.kaydedildi) { TEL.oturumuKaydet(state.oturum); state.kaydedildi = true; }
      const oz = TEL.ozet();
      veriKutu = '<aside class="veri-kutu" data-cy="veri-kaydedildi"><b>Bu oyunun 3 kararı kaydedildi.</b>' +
        '<p>Bu cihazda toplam <span data-cy="veri-oturum">' + oz.oturum + '</span> oyun (' + oz.satir + ' satır) var. Hedef: en az 15 oyun.</p>' +
        '<div class="veri-dugmeler"><button class="primary" data-cy="sonraki-oyuncu">Sonraki oyun</button>' +
        '<button class="ghost" data-cy="veri-paneli">Toplanan veriyi gör</button></div></aside>';
    }
    h('<main class="screen ending tone-' + e.tone + '" data-cy="ending">' + veriBandi() +
      '<p class="eyebrow">' + esc(e.code) + '</p><h1>' + esc(e.title) + '</h1><p class="story">' + esc(e.text) + '</p>' + veriKutu +
      '<h3>Karar izin</h3><ol class="trail" data-cy="trail">' +
      S.decisions.map((d) => {
        const k = state.choices[d.id];
        return '<li><span class="t-tag">' + esc(d.tag) + '</span><span>' + k + ' · ' + esc(d.options[k].short) + '</span>' +
          (state.pressured[d.id] ? '<em class="pressure" data-cy="pressure-' + d.id + '">süre baskısı</em>' : '') +
          (state.model[d.id] && state.model[d.id].mudahale ? '<em class="pressure tut" data-cy="mudahale-iz-' + d.id + '">tutor devreye girdi</em>' : '') + '</li>';
      }).join('') + '</ol>' +
      '<h3>Bugün öğrendiğim</h3><div class="lessons" data-cy="lessons">' +
      ordered.map((d) => '<label class="lesson ' + (d.id === goalId ? 'goal' : '') + '"><input type="checkbox" id="learned-' + d.id + '" data-cy="learned-' + d.id + '"><span><b>' + esc(d.lesson.term) + '</b>' + esc(d.lesson.text) + '</span></label>').join('') +
      '</div><button class="primary" data-cy="restart">Baştan oyna</button>' +
      '<p class="credit">Olay: 19 Temmuz 2024 CrowdStrike kesintisi. Hastane, kişiler ve hasta verileri kurgusaldır.</p></main>');
    const reset = (keepCode) => {
      state.choices = {}; state.pressured = {}; state.tutorLog = []; state.usedQuestions = []; state.step = 0; state.hintOpen = false;
      if (VERI_MODU) { state.profile = { level: null, role: null, goal: null }; if (!keepCode) state.oyuncuKodu = ''; }
      state.screen = 'profile'; render();
    };
    app.querySelector('[data-cy=restart]').addEventListener('click', () => reset(true));
    const so = app.querySelector('[data-cy=sonraki-oyuncu]');
    if (so) so.addEventListener('click', () => reset(true));
    const vp = app.querySelector('[data-cy=veri-paneli]');
    if (vp) vp.addEventListener('click', () => { reset(true); state.screen = 'veri'; render(); });
  }

  /* ---------- Veri paneli (yalnız ?mod=veri) ---------- */
  function renderVeri() {
    const oz = TEL.ozet();
    const kisiler = Object.entries(oz.kisi).map(([k, n]) => '<li><span>' + esc(k) + '</span><b>' + n + ' oyun</b></li>').join('') || '<li><span>Henüz veri yok</span></li>';
    h('<main class="screen" data-cy="screen-veri">' + veriBandi() +
      '<p class="eyebrow">Veri paneli</p><h1>' + oz.oturum + ' oyun, ' + oz.satir + ' karar</h1>' +
      '<p class="story">Hedef: en az 15 gerçek oyun (ör. 3 kişi × 5 oyun). Her karar bir satır.</p>' +
      '<ul class="kisi-liste" data-cy="kisi-liste">' + kisiler + '</ul>' +
      '<div class="veri-dugmeler"><button class="primary" data-cy="csv-indir">CSV indir</button>' +
      '<button class="ghost" data-cy="csv-kopyala">CSV\'yi kopyala</button></div>' +
      '<p class="durum" data-cy="veri-durum" role="status"></p>' +
      '<textarea class="csv-alan" data-cy="csv-alan" readonly hidden></textarea>' +
      '<button class="primary" data-cy="yeni-oyun">Yeni oyun başlat</button>' +
      '<details class="tehlike"><summary>Verileri sil</summary><p>Bu cihazdaki tüm kayıtlar silinir. Önce CSV\'yi indirdiğinden emin ol.</p>' +
      '<button class="ghost tehlike-btn" data-cy="veri-sil">Evet, hepsini sil</button></details>' +
      '</main>');
    const durum = app.querySelector('[data-cy=veri-durum]');
    app.querySelector('[data-cy=csv-indir]').addEventListener('click', () => {
      const blob = new Blob([TEL.csv()], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'oturumlar.csv';
      document.body.appendChild(a); a.click(); a.remove();
      durum.textContent = 'oturumlar.csv indirildi. Bu dosyayı Claude sohbetine gönder.';
    });
    app.querySelector('[data-cy=csv-kopyala]').addEventListener('click', async () => {
      const metin = TEL.csv();
      try { await navigator.clipboard.writeText(metin); durum.textContent = 'Kopyalandı. Sohbete yapıştırabilirsin.'; }
      catch (e) {
        const ta = app.querySelector('[data-cy=csv-alan]'); ta.hidden = false; ta.value = metin; ta.select();
        durum.textContent = 'Otomatik kopyalanamadı; metin seçildi, elle kopyala.';
      }
    });
    app.querySelector('[data-cy=yeni-oyun]').addEventListener('click', () => { state.screen = 'profile'; render(); });
    app.querySelector('[data-cy=veri-sil]').addEventListener('click', () => { TEL.sil(); render(); });
  }

  /* ---------- Parite (diferansiyel test) ekranı: ?parite=1 ---------- */
  async function renderParite() {
    h('<main class="screen" data-cy="screen-parite"><p class="eyebrow">Diferansiyel test · uygulama tarafı</p><h1>Parite</h1>' +
      '<p class="story">Python (test kahini) ile aynı 5 girdiyi bu uygulamanın çıkarım motoruna veriyoruz.</p>' +
      '<p class="based">Motor: <span data-cy="motor">yükleniyor…</span> · Kaynak: <span data-cy="model-kaynak">—</span></p>' +
      '<div class="tablo-kap"><table class="parite"><thead><tr><th>#</th><th>Uygulama p</th><th>Python p</th><th>|fark|</th></tr></thead><tbody data-cy="parite-tablo"></tbody></table></div></main>');
    try {
      const vakalar = await (await fetch('tests/parite.json', { cache: 'no-store' })).json();
      await M.yukle();
      app.querySelector('[data-cy=motor]').textContent = M.durum.motor || ('yok: ' + M.durum.hata);
      app.querySelector('[data-cy=model-kaynak]').textContent = M.durum.kaynak || '—';
      const tb = app.querySelector('[data-cy=parite-tablo]');
      for (let i = 0; i < vakalar.vakalar.length; i++) {
        const v = vakalar.vakalar[i];
        const p = await M.tahmin(v.girdi);
        const fark = Math.abs(p - v.p_python);
        tb.insertAdjacentHTML('beforeend', '<tr data-cy="parite-vaka" data-p="' + p + '" data-py="' + v.p_python + '"><td>' + (i + 1) + '</td><td data-cy="p">' + p.toFixed(6) +
          '</td><td data-cy="p-python">' + v.p_python.toFixed(6) + '</td><td data-cy="fark">' + fark.toExponential(2) + '</td></tr>');
      }
    } catch (e) {
      app.querySelector('[data-cy=motor]').textContent = 'hata: ' + (e.message || e);
    }
  }

  function render() {
    if (state.screen !== 'decision') stopTimer();
    ({ profile: renderProfile, intro: renderIntro, decision: renderDecision, outcome: renderOutcome, ending: renderEnding, veri: renderVeri, parite: renderParite })[state.screen]();
  }
  render();
})();

</script>

</body>
</html>
